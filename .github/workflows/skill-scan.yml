name: Skill scan

on:
  pull_request:

jobs:
  clean-skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci && npm run build
      - name: Scan the clean fixture skill via the reusable action
        uses: ./
        with:
          path: fixtures/skills/clean
